<script>
(()=>{'use strict';
const C=window.LX_CONFIG||{};const KEY=C.storeKey||'doraemon';
const DAPI='https://www.googleapis.com/drive/v3/files',FOLD='application/vnd.google-apps.folder';
const GSC='openid email profile https://www.googleapis.com/auth/drive';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lc=s=>String(s||'').trim().toLowerCase();
const gq=x=>String(x).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let tt;function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('on'),2800)}

/* ================= 구글 로그인 ================= */
let GT={tok:null,exp:0},gtc=null;
try{const t=JSON.parse(sessionStorage.getItem(KEY+'-gt')||localStorage.getItem(KEY+'-gt')||'null');if(t&&t.exp>Date.now()+60000)GT=t}catch(e){}
const GAPP=(()=>{try{return navigator.standalone===true||matchMedia('(display-mode: standalone)').matches}catch(e){return false}})();
const gRU=()=>location.origin+location.pathname.replace(/index\.html$/,'');
function gKeep(){try{sessionStorage.setItem(KEY+'-gt',JSON.stringify(GT));if(GAPP)localStorage.setItem(KEY+'-gt',JSON.stringify(GT))}catch(e){}}
(function(){const h=location.hash||'';if(!/(access_token|error)=/.test(h)||!/state=/.test(h))return;const p=new URLSearchParams(h.slice(1));let st='';try{st=localStorage.getItem(KEY+'-gst')||'';localStorage.removeItem(KEY+'-gst')}catch(e){}
  if(p.get('access_token')&&st&&p.get('state')===st){GT={tok:p.get('access_token'),exp:Date.now()+(Number(p.get('expires_in'))||3600)*1000};gKeep()}
  try{history.replaceState(null,'',location.pathname+location.search)}catch(e){location.hash=''}})();
function gRedirect(){const st=Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,'0')).join('');try{localStorage.setItem(KEY+'-gst',st)}catch(e){}let hint='';try{hint=localStorage.getItem(KEY+'-gmail')||''}catch(e){}
  const q={client_id:C.clientId,redirect_uri:gRU(),response_type:'token',scope:GSC,include_granted_scopes:'true',state:st};if(hint)q.login_hint=hint;else q.prompt='select_account';location.href='https://accounts.google.com/o/oauth2/v2/auth?'+new URLSearchParams(q)}
function gisLoad(){return new Promise((res,rej)=>{if(window.google&&google.accounts&&google.accounts.oauth2)return res();const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=true;s.onload=()=>res();s.onerror=()=>rej({code:'gisfail'});document.head.appendChild(s)})}
function gToken(){return new Promise((res,rej)=>{gisLoad().then(()=>{gtc=gtc||google.accounts.oauth2.initTokenClient({client_id:C.clientId,scope:GSC,callback:()=>{}});
  gtc.callback=r=>{if(r.error){rej(r);return}GT={tok:r.access_token,exp:Date.now()+(Number(r.expires_in)||3600)*1000};gKeep();res(GT.tok)};
  gtc.error_callback=e=>rej(e);let hint;try{hint=localStorage.getItem(KEY+'-gmail')||undefined}catch(e){}gtc.requestAccessToken({prompt:hint?'':'select_account',login_hint:hint})}).catch(rej)})}
async function gSignIn(){if(GAPP||!(window.google&&google.accounts&&google.accounts.oauth2)){gRedirect();return}try{await gToken();location.reload()}catch(e){if(e&&(e.error==='access_denied'||e.type==='popup_closed'))toast('로그인을 취소했습니다');else gRedirect()}}
function gSignOut(){try{if(GT.tok&&window.google&&google.accounts)google.accounts.oauth2.revoke(GT.tok,()=>{})}catch(e){}GT={tok:null,exp:0};try{sessionStorage.removeItem(KEY+'-gt');localStorage.removeItem(KEY+'-gt')}catch(e){}location.reload()}
function gExpired(){GT={tok:null,exp:0};try{sessionStorage.removeItem(KEY+'-gt');localStorage.removeItem(KEY+'-gt')}catch(e){}if(S.auth!=='login'){S.auth='login';render();toast('로그인 시간이 지났습니다. 다시 로그인하면 이어서 씁니다')}}
if(!GT.tok&&C.clientId)setTimeout(()=>gisLoad().catch(()=>{}),300);

/* ================= 구글 드라이브 ================= */
async function gf(url,o={}){if(!GT.tok||GT.exp<Date.now()+20000){gExpired();throw {code:'auth'}}const r=await fetch(url,{...o,headers:{...(o.headers||{}),Authorization:'Bearer '+GT.tok}});
  if(r.status===401){gExpired();throw {code:'auth'}}if(!r.ok)throw {code:r.status===404?'notfound':'drive',status:r.status};return r}
async function gList(q,fields){let out=[],pt='';do{const u=`${DAPI}?q=${encodeURIComponent(q)}&fields=${encodeURIComponent('nextPageToken,'+(fields||'files(id,name,mimeType,modifiedTime,size,parents)'))}&pageSize=1000&supportsAllDrives=true&includeItemsFromAllDrives=true${pt?'&pageToken='+pt:''}`;const j=await (await gf(u)).json();out=out.concat(j.files||[]);pt=j.nextPageToken||''}while(pt);return out}
async function gCreate(name,parent,mime,body){const meta={name,mimeType:mime,...(parent?{parents:[parent]}:{})};
  if(body===undefined){const r=await gf(DAPI+'?fields=id',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(meta)});return {id:(await r.json()).id}}
  if(!(body instanceof Blob))body=new Blob([body],{type:mime});
  if(body.size>4*1048576){const r0=await gf('https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable&fields=id,modifiedTime',{method:'POST',headers:{'content-type':'application/json; charset=UTF-8','x-upload-content-type':mime},body:JSON.stringify(meta)});
    const loc=r0.headers.get('location');if(!loc)throw {code:'drive'};const r=await fetch(loc,{method:'PUT',headers:{'content-type':mime},body});if(!r.ok)throw {code:'drive',status:r.status};return r.json()}
  const bd='lx'+Math.random().toString(36).slice(2);const blob=new Blob([`--${bd}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${bd}\r\nContent-Type: ${mime}\r\n\r\n`,body,`\r\n--${bd}--`]);

    if(bare(t).length<15&&C.mediaUrl&&+f.size<15*1048576){try{const r=await media('describe',{fileId:f.id,mime:f.mimeType||'image/jpeg'});t=(t+'\n'+r.text).trim();f._via='AI 사진 읽기'}catch(e){}}}

function chunkText(t){const parts=String(t).split(/\[p\.(\d+)\]\n?/);let pages=[];if(parts.length>1){if(parts[0].trim())pages.push([0,parts[0]]);for(let i=1;i<parts.length;i+=2)pages.push([+parts[i],parts[i+1]||''])}else pages=[[0,t]];
  const out=[];let buf='',p0=null,p1=null,fresh=0;
  for(const [p,tx] of pages){let s=String(tx).replace(/[ \t]+/g,' ').replace(/\n{2,}/g,'\n').trim();
    while(s.length){if(p0==null)p0=p;const room=CH-buf.length;if(s.length<=room){buf+=(buf?'\n':'')+s;p1=p;fresh+=s.length;s=''}
      else{let cut=s.lastIndexOf(' ',room);if(cut<room*0.6)cut=Math.max(room,1);buf+=(buf?'\n':'')+s.slice(0,cut);p1=p;fresh+=cut;s=s.slice(cut).trim();out.push({p0,p1,text:buf});buf=buf.slice(-OV);p0=p;fresh=0}}}
  if(fresh>40||(!out.length&&buf.trim()))out.push({p0,p1:p1??p0,text:buf});
  return out.map((c,i)=>({n:i,p0:c.p0,p1:c.p1,text:c.text,refs:findRefs(c.text)}))}

const capKey=(parent,name)=>(parent||'')+'|'+String(name).replace(/\.[^.]+$/,'').trim().toLowerCase();
async function scanLib(){await folderMap(true);const found=new Map(),caps=new Map(),failed=new Set();

async function indexOne(e,blob){S.idx.cur=e.title||e.name;paintIdx();const f={id:e.id,name:e.name,mimeType:e.mime,size:e.size,_cap:e.cap};

/* 책 카드 (AI): 4권씩 묶어 한 번에 · 서지 · 요약 · 주제 · 분류 */

async function bookCards(list){const items=[];for(const e of list){const c=await chunksOf(e);const mid=Math.floor(c.length/2),pick=[...c.slice(0,3),...(c.length>8?[c[mid],c[Math.floor(c.length*0.8)]]:[])];items.push({e,first:pick.map(x=>x.text).join('\n').slice(0,2600)})}
  const r=await aiJSON(`아래 자료 ${items.length}개 각각의 서지 정보 · 분류 · 성격을 분석한다. 파일 이름과 앞 · 중간 부분만 보고 판단하며, 모르는 칸은 비운다(지어내지 않는다).\n분류(category)는 반드시 이 목록 중 하나를 그대로 쓴다: ${cats().join(' / ')}\n자료 성격(genre)은 이 중 하나: ${GENRES.join(' / ')}\n수준(level)은 입문 · 중급 · 전문 중 하나.\n주제 태그(topics)는 2~8자의 짧은 말로, 아래 이미 있는 태그와 뜻이 같으면 그 태그를 그대로 쓴다: ${topTopics(40).join(', ')||'(아직 없음)'}\n\n${items.map((x,i)=>`[${i+1}] 파일 이름: ${x.e.name} (${kindOf(x.e)} · ${x.e.path||''})\n앞부분:\n${x.first}`).join('\n\n')}\n\nJSON: {"items":[{"i":1,"title":"","author":"","year":"","category":"","genre":"","level":"","claim":"이 자료의 핵심 주장 한 문장","summary":"두세 문장","toc":["장 제목" 최대 10],"topics":["주제 태그" 최대 6]}]}`,{tier:'fast',max:Math.min(6000,800*items.length+400)});
  const C2=cats(),done=new Set();(r.items||[]).forEach(it=>{const x=items[(+it.i||0)-1];if(!x)return;const e=x.e,n=parseName(e.name);done.add(e);const ic=String(it.category||'').trim();
    const cat=C2.find(c=>c===ic)||C2.find(c=>ic&&(c.includes(ic)||ic.includes(c.split(' ')[0])))||C2[C2.length-1];
    Object.assign(e,{title:n.author?n.title:(it.title||e.title),author:n.author||it.author||e.author,year:String(it.year||''),summary:it.summary||'(요약 없음)',toc:(it.toc||[]).slice(0,10),topics:(it.topics||[]).map(String).slice(0,6),cat,genre:GENRES.find(g=>g===it.genre)||GENRES.find(g=>it.genre&&g.includes(String(it.genre).split(/\s/)[0]))||GENRES[GENRES.length-1],level:['입문','중급','전문'].find(v=>String(it.level||'').includes(v))||'',claim:String(it.claim||'').slice(0,200),cv:2})});

async function autoCards(force){if(CARDING)return;const L=S.lib.filter(e=>e.status==='ok'&&(!e.summary||e.cv!==2)&&(e.cardFail||0)<2);

  const mv=e.parent&&e.parent!==fid?`&addParents=${fid}&removeParents=${e.parent}`:'';if(!mv&&nn===e.name){e.tidied=e.cat;return}
  const r=await (await gf(`${DAPI}/${encodeURIComponent(e.id)}?fields=id,name,modifiedTime,parents${mv}`,{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify(nn!==e.name?{name:nn}:{})})).json();

async function ai(messages,{tier='default',max=4000,system}={}){if(!C.relayUrl)throw {code:'noai'};if(!GT.tok||GT.exp<Date.now()+20000){gExpired();throw {code:'auth'}}

  const j=await r.json().catch(()=>({error:'server'}));if(j.error){if(j.error==='daily_limit')toast(`오늘 AI 사용 한도(${j.limit}회)를 다 썼습니다`);throw {code:j.error,why:j.why}}
  return (j.content||[]).filter(x=>x.type==='text').map(x=>x.text).join('')}
async function aiJSON(p,o){const t=await ai(p+'\n\nJSON만 출력한다. 설명 없이.',o);const a=t.indexOf('{'),b=t.indexOf('[');const s=(b>=0&&(a<0||b<a))?b:a;const e=Math.max(t.lastIndexOf('}'),t.lastIndexOf(']'));if(s<0||e<0)throw {code:'json'};return JSON.parse(t.slice(s,e+1))}

    if(!picks||!picks.length)picks=C0.slice(0,24).map(c=>({c,s:[...c.secs],v:2}));
    const perSec=g.outline.map(()=>[]);picks.sort((a,b)=>b.v-a.v||b.c.score-a.c.score).forEach(p=>{(p.s.length?p.s:[...p.c.secs]).forEach(si=>{if(perSec[si]&&perSec[si].length<8&&!perSec[si].includes(p.c.d))perSec[si].push(p.c.d)})});

async function writePart(g,inp,part,ss,chars,how,prev){const sys=`너는 신학 연구 조교로, 사용자의 구글 드라이브 서재(AI 색인)에서 찾은 아래 [근거 자료]만 근거로 글을 쓴다. 웹 · 일반 상식 · 기억으로 사실을 보태지 않는다.\n[사용자의 연구 철학 · 원칙 — 모든 글에서 지킨다]\n${S.set.philo||PHILO0}\n규칙:\n- 모든 문장 끝에 근거를 [S번호]로 단다. 근거 자료에 없는 내용은 쓰지 않는다. 마침표 뒤가 아니라 문장 안 끝에 단다 (예: …이다[S3].)\n- 근거가 부족한 부분은 "(서재에 자료 부족)"이라고만 적는다. 일반 지식으로 채우지 않는다.\n- 사용자의 생각은 "내 생각:"으로 구분해 소개하고, 그것을 근거와 비교한다.\n- 해석이 갈리면 입장을 나란히 보여 준다.\n- 직접 인용은 큰따옴표 "…" 안에 원문 그대로, 한 곳에 두 문장 이내로만 한다.\n- 원어는 자료에 나온 것만 쓴다.\n- 성경 본문을 그대로 옮길 때는 줄 맨 앞에 "> "를 붙인 인용 줄로 쓰고 구절 표시를 붙인다.\n- 독자 · 회중에게 던질 질문은 물음표로 끝나는 한 문장으로 쓴다.\n- 목차마다 가장 중요한 핵심 문장 하나를 **굵게** 쓴다.\n- 마크다운으로 쓴다: 목차마다 "## 목차 이름"으로 시작, 필요하면 "### 소제목", 목록, 표.`;
  const src=ss.map(x=>`[S${x.s}] ${bookLabel(x.book)} ${pg(x)}\n${x.text}`).join('\n\n');
  const user=`[지침] ${g.name}\n말투: ${g.tone||''}\n꼭 넣을 것: ${(g.must||[]).join(' / ')||'없음'}\n피할 것: ${(g.avoid||[]).join(' / ')||'없음'}\n\n[입력]\n${inp}\n\n[이번에 쓸 목차] (분량: 약 ${chars}자)\n${part.map(o=>`## ${o.h} — ${o.ask}`).join('\n')}\n${how?`\n[고쳐 쓰기 요청] ${how}\n[지금 글]\n${prev}\n`:''}\n[근거 자료]\n${src||'(없음)'}`;

function splitSections(md,part){const out=part.map(()=>'');const blocks=String(md).split(/^##\s+/m).map(x=>x.trim()).filter(Boolean);
  if(blocks.length<=1&&part.length===1)return [String(md).replace(/^##\s+.*\n?/,'').trim()];
  blocks.forEach(b=>{const h=b.split('\n')[0].replace(/\s*—.*$/,'').trim();let k=part.findIndex(o=>h.includes(o.h)||o.h.includes(h));if(k<0)k=out.findIndex(x=>!x);if(k<0)k=part.length-1;out[k]+=(out[k]?'\n\n':'')+b.split('\n').slice(1).join('\n').trim()});return out}
const nzq=s=>String(s).replace(/[\s"'“”‘’.,·…\-–—()\[\]]/g,'');
/* 근거 없는 문장 표시: [S번호]가 없는 문장 (내 생각 · 서재에 없음 표시는 뺌) */
function markNoCite(line){const segs=line.split(/(?<=[.!?。…])\s+/);for(let i=1;i<segs.length;i++){const m=segs[i].match(/^((?:\[S\d+\]\s*)+)/);if(m){segs[i-1]+=m[1].trim();segs[i]=segs[i].slice(m[1].length)}}

async function pvOpen(x){const title=citeOf(x);modal(`<div class="row"><b class="grow">${esc(title)}</b><button class="btn sm" data-a="close">닫기</button></div><div class="row" style="margin:8px 0"><button class="btn sm" data-a="pvgo:-1">‹ 앞쪽</button><span class="grow note" id="pvlbl" style="text-align:center"></span><button class="btn sm" data-a="pvgo:1">뒤쪽 ›</button></div><div id="pvbox" class="pvbox"><p class="note">원문 쪽을 불러오는 중…</p></div><div class="row" style="margin-top:10px"><a class="btn sm pri" href="${gView(x.fileId)}" target="_blank" rel="noopener">구글 드라이브에서 열기 ↗</a></div>`);

async function pvDraw(){const box=$('#pvbox');if(!box||!PV)return;const p=await PV.doc.getPage(PV.page);const w=Math.min(box.clientWidth||600,900);const v1=p.getViewport({scale:1});const dpr=Math.min(2,window.devicePixelRatio||1);const vp=p.getViewport({scale:w/v1.width*dpr});
  const cv=document.createElement('canvas');cv.width=Math.floor(vp.width);cv.height=Math.floor(vp.height);cv.style.width='100%';const ctx=cv.getContext('2d');await p.render({canvasContext:ctx,viewport:vp}).promise;
  if(PV.hp.has(PV.page))try{const tc=await p.getTextContent();const hz=nzq(PV.hl||'');ctx.fillStyle='rgba(224,180,92,.38)';for(const it of tc.items){const z=nzq(it.str);if(z.length<4||!hz.includes(z))continue;const t=PV.L.Util.transform(vp.transform,it.transform);const h=Math.hypot(t[2],t[3]);ctx.fillRect(t[4],t[5]-h*0.9,(it.width||0)*vp.scale,h*1.15)}}catch(e){}

  <div class="list" style="margin-top:8px">${S.guides.map(g=>`<div class="it"><div class="grow"><div class="t">${esc(g.name)}</div><div class="m">${g.input==='passage'?'본문':'주제'} · ${esc(g.length||'')} · 목차 ${g.outline.length}개</div><div class="x">${g.outline.map(o=>esc(o.h)).join(' → ')}</div></div><div class="row"><button class="btn sm" data-a="gedit:${esc(g.id)}">고치기</button><button class="btn sm" data-a="gcopy:${esc(g.id)}">복사</button></div></div>`).join('')}</div>`}
function guideModal(g){const isNew=!g;g=g||{id:'g'+Date.now(),name:'',input:'topic',desc:'',length:'A4 5쪽',tone:'',outline:[{h:'',ask:''}],must:[],avoid:[]};
  modal(`<div class="row"><h2 class="grow" style="margin:0">${isNew?'새 지침':'지침 고치기'}</h2><button class="btn sm" data-a="close">닫기</button></div><form id="f-guide" data-id="${esc(g.id)}">
   <div class="field"><label for="g-name">이름</label><input type="text" id="g-name" required value="${esc(g.name)}" placeholder="예: 설교 개요"></div>
   <div class="row wrapx"><div class="field grow"><label for="g-input">넣는 것</label><select id="g-input"><option value="passage" ${g.input==='passage'?'selected':''}>본문 (성경 구절)</option><option value="topic" ${g.input!=='passage'?'selected':''}>주제</option></select></div><div class="field grow"><label for="g-len">분량</label><input type="text" id="g-len" value="${esc(g.length)}" placeholder="예: A4 5쪽"></div></div>
   <div class="field"><label for="g-desc">한 줄 설명</label><input type="text" id="g-desc" value="${esc(g.desc||'')}"></div>
   <div class="field"><label for="g-tone">말투 · 독자</label><input type="text" id="g-tone" value="${esc(g.tone||'')}" placeholder="예: 청년부 교사용, 쉬운 말"></div>
   <div class="field"><label for="g-out">목차 <span class="note">(한 줄에 하나 · "제목 | 무엇을 쓸지")</span></label><textarea id="g-out" rows="7">${esc(g.outline.map(o=>o.h+(o.ask?' | '+o.ask:'')).join('\n'))}</textarea></div>
   <div class="field"><label for="g-must">꼭 넣을 것 <span class="note">(한 줄에 하나)</span></label><textarea id="g-must" rows="2">${esc((g.must||[]).join('\n'))}</textarea></div>
   <div class="field"><label for="g-avoid">피할 것 <span class="note">(한 줄에 하나)</span></label><textarea id="g-avoid" rows="2">${esc((g.avoid||[]).join('\n'))}</textarea></div>
   <div class="field"><label>먼저 찾을 분류 <span class="note">(선택)</span></label><div class="chks">${cats().map(c=>`<label class="chk"><input type="checkbox" name="g-pc" value="${esc(c)}" ${(g.preferCats||[]).includes(c)?'checked':''}> ${esc(c)}</label>`).join('')}</div></div>
   <div class="row"><button class="btn pri grow">저장</button>${isNew?'':`<button type="button" class="btn" data-a="gdel:${esc(g.id)}">지우기</button>`}</div></form>`)}
/* --- 설정 --- */

/* ================= 동작 ================= */
document.addEventListener('click',async ev=>{if(ev.target.closest('a[href]'))return;const b=ev.target.closest('[data-a]');if(!b)return;const raw=b.dataset.a;const i=raw.indexOf(':');const a=i<0?raw:raw.slice(0,i),arg=i<0?'':raw.slice(i+1);
  if(a==='ovclose'){if(ev.target===b)closeModal();return}
  if(a==='close'){closeModal();return}
  if(a==='login'){gSignIn();return}
  if(a==='logout'){gSignOut();return}
  if(a==='reload'){location.reload();return}
  if(a==='tab'){if(arg==='lib'&&S.tab!=='lib')S.libq='';S.tab=arg;if(arg==='box')S.box=null;window.scrollTo(0,0);render();if(arg==='search')setTimeout(()=>$('#q')?.focus(),0);return}
  if(a==='pickg'){S.mk.guide=arg;render();return}
  if(a==='make'){makeDoc();return}
  if(a==='jobclear'){S.job=null;render();return}
  if(a==='ideaclr'){S.mk.ideaName='';S.mk.ideaText='';render();return}
  if(a==='pinclr'){S.pins=[];render();return}
  if(a==='pin'){const d=+arg;S.pins=S.pins.includes(d)?S.pins.filter(x=>x!==d):[...S.pins,d];render();return}
  if(a==='chunk'){const x=IX.docs[+arg],e=IX.books[x.b];modal(`<div class="row"><b class="grow">${esc(bookLabel(e))} ${pg(x)}</b><button class="btn sm" data-a="close">닫기</button></div><p style="white-space:pre-wrap;font-size:14px;line-height:1.7">${esc(x.text)}</p><a class="btn sm" href="${gView(e.id)}" target="_blank" rel="noopener">원본 열기</a>`);return}
  if(a==='q2make'){const g=S.guides.find(x=>x.input==='topic');if(g)S.mk.guide=g.id;S.mk.topic=S.q;S.tab='make';render();return}
  if(a==='libadd'){folderPicker('');return}
  if(a==='libpick'){const [id,...nm]=arg.split('|');if(!S.set.libs.some(l=>l.id===id)){S.set.libs.push({id,name:nm.join('|')});await saveSet()}closeModal();render();toast('연결했습니다. 색인을 시작합니다');runIndex();return}
  if(a==='libdel'){if(!confirm('이 폴더를 서재에서 뺄까요? (드라이브 파일은 그대로입니다)'))return;S.set.libs=S.set.libs.filter(l=>l.id!==arg);await saveSet();S.lib=S.lib.filter(e=>e.root!==arg);saveLib(true);ixDirty();render();return}
  if(a==='index'){runIndex();return}
  if(a==='reidx'){const e=S.lib.find(x=>x.id===arg);if(e){e.status='wait';e.tries=0;runIndex([e])}return}
  if(a==='libf'){S.libf=arg;render();return}
  if(a==='cards'){autoCards(true);return}
  if(a==='idxstop'){S.idx.stop=true;toast('지금 자료까지 하고 멈춥니다');return}
  if(a==='driveall'){S.set.drive=arg||'pdf';await saveSet();render();runIndex();return}
  if(a==='libc'){S.libc=arg;render();return}
  if(a==='by'){S.lv={by:arg,key:null,sort:S.lv.sort};S.libq='';render();window.scrollTo(0,0);return}
  if(a==='shelf'){const k=arg.indexOf('|');closeModal();S.libq='';S.tab='lib';S.lv={by:arg.slice(0,k),key:arg.slice(k+1),sort:S.lv.sort};render();window.scrollTo(0,0);return}
  if(a==='shelfback'){S.lv.key=null;render();return}
  if(a==='lsort'){S.lv.sort=arg;render();return}
  if(a==='book'){const e=S.lib.find(x=>x.id===arg);if(e)bookModal(e);return}
  if(a==='mkfrom'){closeModal();S.mk.scope='file:'+arg;S.tab='make';render();window.scrollTo(0,0);toast('이 자료 안에서만 근거를 찾습니다');return}
  if(a==='shelfmake'){S.mk.scope=S.lv.by+':'+S.lv.key;const g=S.guides.find(x=>x.input==='topic');if(g&&guideOf(S.mk.guide).input!=='topic')S.mk.guide=g.id;if(!S.mk.topic&&S.lv.by==='topic')S.mk.topic=S.lv.key;S.tab='make';render();window.scrollTo(0,0);return}
  if(a==='ftsearch'){S.tab='search';doSearch(S.libq);return}
  if(a==='ecard'){const e=S.lib.find(x=>x.id===arg);if(e)cardModal(e);return}
  if(a==='pv'){const x=S.doc&&S.doc.sources.find(s=>s.s===+arg);if(x)pvOpen(x);return}
  if(a==='pvx'){const x=IX.docs[+arg],e=x&&IX.books[x.b];if(e)pvOpen({fileId:e.id,ty:typeOf({mimeType:e.mime,name:e.name}),title:e.title,author:e.author,p0:x.p0,p1:x.p1,u:x.u,text:x.text});return}
  if(a==='pvgo'){if(PV){const n=PV.page+(+arg);if(n>=1&&n<=PV.doc.numPages){PV.page=n;pvDraw()}}return}
  if(a==='philosave'){S.set.philo=$('#set-philo').value.trim()||PHILO0;await saveSet();toast('연구 철학을 저장했습니다. 다음 자료부터 적용됩니다');return}
  if(a==='philoreset'){$('#set-philo').value=PHILO0;return}
  if(a==='catsave'){const v=$('#set-cats').value.split('\n').map(x=>x.trim()).filter(Boolean);if(!v.length){toast('분류를 한 줄 이상 적어 주세요');return}S.set.cats=v;await saveSet();toast('분류를 저장했습니다');return}
  if(a==='recat'){if(!confirm('모든 자료의 AI 정리(요약 · 주제 · 분류)를 다시 만들까요? 자료 4개에 AI를 1번 씁니다.'))return;S.lib.forEach(e=>{if(e.status==='ok'){e.summary='';e.cardFail=0}});S.tab='lib';render();autoCards(true);return}
  if(a==='mediatest'){const el=$('#mres');el.textContent='확인 중…';try{const r=await media('ping',{});el.textContent='✓ 연결됨 '+(r.model||'')}catch(e){el.textContent=e.message||'연결 안 됨'}return}
  if(a==='open'){toast('여는 중…');try{S.doc=JSON.parse(await gRead(arg));S.tab='doc';render()}catch(e){toast('열지 못했습니다')}return}
  if(a==='src'){srcModal(+arg);return}
  if(a==='srcs'){srcsModal();return}
  if(a==='word'){exportWord();return}
  if(a==='pdf'){exportPdf();return}
  if(a==='rw'){const n=+arg;modal(`<div class="row"><h2 class="grow" style="margin:0">"${esc(S.doc.sections[n].h)}" 다시 쓰기</h2><button class="btn sm" data-a="close">닫기</button></div><div class="tabs2">${['더 자세히','더 짧게','다른 해석도 함께','근거를 더 촘촘히','쉬운 말로'].map(x=>`<button data-a="rwgo:${n}|${x}">${x}</button>`).join('')}</div><form id="f-rw" data-n="${n}" class="row"><input type="text" id="rwhow" placeholder="직접 적기"><button class="btn pri">다시 쓰기</button></form>`);return}
  if(a==='rwgo'){const [n,...h]=arg.split('|');closeModal();rewriteSec(+n,h.join('|'));return}
  if(a==='gnew'){guideModal(null);return}
  if(a==='gedit'){guideModal(S.guides.find(g=>g.id===arg));return}
  if(a==='gcopy'){const g=S.guides.find(x=>x.id===arg);if(g){const c=JSON.parse(JSON.stringify(g));c.id='g'+Date.now();c.name=g.name+' (복사)';S.guides.push(c);await saveGuides();render();guideModal(c)}return}
  if(a==='gdel'){if(S.guides.length<=1){toast('지침은 하나 이상 있어야 합니다');return}if(!confirm('이 지침을 지울까요?'))return;S.guides=S.guides.filter(g=>g.id!==arg);if(S.mk.guide===arg)S.mk.guide=S.guides[0].id;await saveGuides();closeModal();render();return}
  if(a==='gai'){modal(`<div class="row"><h2 class="grow" style="margin:0">AI로 지침 만들기</h2><button class="btn sm" data-a="close">닫기</button></div><p class="note">어떤 자료를 어떤 모양으로 받고 싶은지 말하듯 적으세요.</p><form id="f-gai"><textarea id="gai-t" rows="6" placeholder="예: 청년부 성경공부 교안. 본문 하나로 도입 질문, 본문 관찰, 해석, 나눔 질문 5개, 적용. A4 3쪽, 쉬운 말."></textarea><button class="btn pri big" style="margin-top:10px">지침 만들기</button></form>`);return}
  if(a==='aitest'){const el=$('#aires');el.textContent='확인 중…';try{const t=await ai('"연결됨"이라고만 답해.',{tier:'fast',max:20});el.textContent='✓ '+t.trim().slice(0,30)}catch(e){el.textContent=aiErr(e)}return}
  if(a==='cache'){await idbClear();ixDirty();toast('기기 사본을 지웠습니다. 다음 검색 때 드라이브에서 다시 받습니다');return}
});
document.addEventListener('submit',async ev=>{const f=ev.target;ev.preventDefault();
  if(f.id==='f-q'){doSearch($('#q').value);return}
  if(f.id==='f-lq'){return}
  if(f.id==='f-card'){const e=S.lib.find(x=>x.id===f.dataset.id);if(!e)return;const cat=$('#c-cat').value;Object.assign(e,{title:$('#c-title').value.trim()||e.title,author:$('#c-author').value.trim(),year:$('#c-year').value.trim(),topics:$('#c-topics').value.split(/[,·]/).map(x=>x.trim()).filter(Boolean),summary:$('#c-sum').value.trim()||e.summary||'(요약 없음)'});
    if(cat!==(e.cat||'')){e.cat=cat;e.tidied=null}saveLib(true);ixDirty();closeModal();render();toast('저장했습니다');tidyAll();return}
  if(f.id==='f-fq'){folderPicker($('#fq').value.trim());return}
  if(f.id==='f-rw'){const n=+f.dataset.n,h=$('#rwhow').value.trim();closeModal();rewriteSec(n,h);return}
  if(f.id==='f-guide'){const id=f.dataset.id;const lines=s=>$(s).value.split('\n').map(x=>x.trim()).filter(Boolean);
    const outline=lines('#g-out').map(l=>{const [h,...r]=l.split('|');return {h:h.trim(),ask:r.join('|').trim()}}).filter(o=>o.h);if(!outline.length){toast('목차를 한 줄 이상 적어 주세요');return}
    const g={id,name:$('#g-name').value.trim()||'새 지침',input:$('#g-input').value,length:$('#g-len').value.trim(),desc:$('#g-desc').value.trim(),tone:$('#g-tone').value.trim(),outline,must:lines('#g-must'),avoid:lines('#g-avoid'),preferCats:[...f.querySelectorAll('input[name=g-pc]:checked')].map(x=>x.value)};
    const k=S.guides.findIndex(x=>x.id===id);if(k>=0)S.guides[k]=Object.assign(S.guides[k],g);else S.guides.push(g);S.mk.guide=id;await saveGuides();closeModal();render();toast('지침을 저장했습니다');return}
  if(f.id==='f-gai'){const t=$('#gai-t').value.trim();if(!t)return;const btn=f.querySelector('button');btn.disabled=true;btn.textContent='만드는 중…';
    try{const r=await aiJSON(`사용자가 원하는 결과물 설명을 보고 자료 만들기 지침을 짠다. 근거는 사용자의 구글 드라이브 신학 서재(AI 색인)에서만 찾는다.\n사용자의 연구 철학 · 원칙:\n${S.set.philo||PHILO0}\n설명: ${t}\nJSON: {"name":"짧은 이름","input":"passage 또는 topic","desc":"한 줄 설명","length":"A4 n쪽","tone":"말투와 독자","outline":[{"h":"목차","ask":"무엇을 쓸지"}],"must":["꼭 넣을 것"],"avoid":["피할 것"]}`,{tier:'fast',max:1500});
      closeModal();guideModal({id:'g'+Date.now(),name:r.name||'',input:r.input==='passage'?'passage':'topic',desc:r.desc||'',length:r.length||'',tone:r.tone||'',outline:(r.outline||[]).filter(o=>o&&o.h),must:r.must||[],avoid:r.avoid||[]});toast('확인하고 저장을 눌러 주세요')}
    catch(e){btn.disabled=false;btn.textContent='지침 만들기';toast(aiErr(e))}return}
});
document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.classList&&ev.target.classList.contains('bk')){ev.target.click()}});
document.addEventListener('input',ev=>{const t=ev.target,id=t.id;const map={'mk-ref':'ref','mk-ptext':'ptext','mk-topic':'topic','mk-idea':'idea','mk-extra':'extra'};
  if(map[id]){S.mk[map[id]]=t.value;return}
  if(id==='libq'){S.libq=t.value;const y=t.selectionStart;render();const x=$('#libq');if(x){x.focus();x.setSelectionRange(y,y)}return}});
document.addEventListener('change',async ev=>{const t=ev.target,id=t.id;
  if(id==='mk-scope'){S.mk.scope=t.value;return}
  if(id==='set-drive'){S.set.drive=t.value;await saveSet();if(t.value!=='off'){toast('내 드라이브 전체를 찾아 색인합니다');runIndex()}else{toast('내 드라이브 전체 색인을 껐습니다');runIndex(null,null,true)}return}
  if(t.type==='checkbox'&&/^set-/.test(id)){S.set[id.slice(4)]=t.checked;saveSet();toast('저장했습니다');return}
  if(id==='set-cite'){S.set.cite=t.value;saveSet();toast('저장했습니다');return}
  if(id==='upf'&&t.files.length){const fs=[...t.files];t.value='';uploadFiles(fs);return}
  if(id==='mk-file'&&t.files.length){const f=t.files[0];t.value='';toast('파일 글을 읽는 중…');try{const tx=await localText(f);S.mk.ideaName=f.name;S.mk.ideaText=String(tx).replace(/\[p\.\d+\]\n?/g,'').slice(0,20000);render();toast('내 생각에 붙였습니다')}catch(e){toast(e.message||'읽지 못했습니다')}return}});
let dragN=0;
document.addEventListener('dragenter',ev=>{if(S.auth!=='ok'||!ev.dataTransfer||![...ev.dataTransfer.types].includes('Files'))return;dragN++;document.body.classList.add('dragging')});
document.addEventListener('dragleave',()=>{if(--dragN<=0){dragN=0;document.body.classList.remove('dragging')}});
document.addEventListener('dragover',ev=>{if(S.auth==='ok'&&ev.dataTransfer&&[...ev.dataTransfer.types].includes('Files'))ev.preventDefault()});
document.addEventListener('drop',ev=>{if(S.auth!=='ok'||!ev.dataTransfer||!ev.dataTransfer.files.length)return;ev.preventDefault();dragN=0;document.body.classList.remove('dragging');uploadFiles([...ev.dataTransfer.files])});
window.addEventListener('beforeunload',e=>{if(S.idx.run||S.up||S.job&&!S.job.err){e.preventDefault();e.returnValue=''}});
window.LX={S,IX,findRefs,parseRefInput,chunkText,toks,bm25,searchAll,parseName,docxOf,docMd,verifyDoc,typeOf,hwpText,hwpxText,pptxText,capText,tsText,cfb,markNoCite,pg};
boot();
})();
